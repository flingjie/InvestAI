system:
  language: en

llm:
  provider: openai
  base_model: qwen-flash
  reason_model: qwen-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: ${OPENAI_API_KEY}

schedule:
  hour: 14
  minute: 07

# =====================
# 通知系统配置
# =====================

notification:
  enabled: true

  # ---------------------
  # 通知渠道定义
  # ---------------------
  channels:
    # ========= Slack =========
    slack:
      enabled: true
      type: slack

      token: ${SLACK_TOKEN} # 从环境变量注入
      default_channel: "#news"

      message_format: markdown

      description: >
        Slack notification channel,
        used for real-time strategy signals, risk warnings, and system status updates.

    # ========= 通用 Webhook =========
    webhook:
      enabled: false
      type: webhook

      endpoints:
        - name: primary_webhook
          url: https://open.feishu.cn/open-apis/bot/v2/hook/xxxx

      description: >
        Custom notification endpoint for integrating with Feishu, Lark, or other custom notification systems.

    # ========= Email =========
    email:
      enabled: false
      type: email

      smtp:
        host: smtp.example.com
        port: 587
        username: ${EMAIL_USERNAME}
        password: ${EMAIL_PASSWORD}
        use_tls: true

      from: investai@yourdomain.com
      to:
        - user@example.com

      description: >
        Used for high-risk or critical exception notifications,
        disabled by default.

    # ========= 控制台 / 日志 =========
    console:
      enabled: true
      type: console

      description: >
        Local development and debugging use,
        all notifications are output to the console.
