strategy:
  id: trend_following_basic
  name: Basic Trend-Following Strategy
  version: "1.0"
  description: >
    A medium-term strategy that follows price trends based on moving averages,
    with pullback and breakout confirmations,
    and filters out volatile periods using volume and momentum indicators.
    This strategy does not predict price movements,
    but instead identifies trend status changes.

# =====================
# Trend-Following Configuration
# =====================
trend:
  moving_averages:
    short: 20 # Short-term moving average period (e.g., MA20)
    long: 60 # Long-term moving average period (e.g., MA60)

  pullback:
    enabled: true
    threshold: 0.03 # Pullback threshold (3%)
    description: >
      When the price briefly falls below the short-term moving average
      but is still above the long-term moving average,
      and the pullback does not exceed this ratio,
      it is considered a normal pullback within the trend.

  breakout:
    resistance_window: 20 # Resistance window for breakout confirmation (N previous days)
    buffer: 0.005 # Breakout buffer ratio (0.5%)
    description: >
      When the price breaks above the highest price in the past N days,
      and exceeds the set buffer ratio,
      it is considered a valid breakout.

# =====================
# Volume Filter Configuration 
# =====================
volume:
  ma_window: 20
  min_ratio: 1.0 # Current volume must be ≥ moving average volume * 1.0
  description: >
    Used to filter out volatile periods or periods with insufficient liquidity,
    ensuring that signals occur when market activity is normal.

# =====================
# RSI Momentum Interval Filtering
# =====================
rsi:
  min: 40
  max: 65
  description: >
    RSI is in the neutral strong interval,
    avoiding entry in overheated or clearly weak states.

# =====================
# CCI Trend Strength Filtering
# =====================
cci:
  min: -100
  max: 100
  description: >
    CCI is in the regular fluctuation interval,
    used to exclude noise signals in extreme overbought or oversold environments.

# =====================
# Risk Disclaimer (Only for Demonstration/Explanation)
# =====================
risk_disclaimer:
  - This strategy does not guarantee profit
  - All signals represent only rule status changes
  - Investment decisions should be made by users themselves
